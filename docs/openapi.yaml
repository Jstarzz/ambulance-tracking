openapi: 3.1.0
info:
  title: Ambulance Tracking API
  version: 1.0.0
  description: |
    REST contract for the ambulance tracking service.

    Realtime WebSocket endpoints are documented in `docs/API.md` because this
    OpenAPI document covers HTTP endpoints only.
servers:
  - url: https://tracking.example.kn
    description: Example production origin
  - url: http://localhost:8080
    description: Local Docker development origin
tags:
  - name: Health
  - name: Dispatcher authentication
  - name: Dispatcher fleet
  - name: Tracker authentication
  - name: Tracker replay
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check API/database health
      operationId: getHealth
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value: { status: ok }
        '503':
          description: Database health check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                unhealthy:
                  value: { status: unhealthy }

  /api/v1/auth/login:
    post:
      tags: [Dispatcher authentication]
      summary: Create dispatcher session
      operationId: loginDispatcher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; also sets the HttpOnly `ambulance_session` cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Dispatcher session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [Dispatcher authentication]
      summary: Revoke current dispatcher session
      operationId: logoutDispatcher
      security:
        - dispatcherCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
          description: CSRF token returned by login
      responses:
        '204':
          description: Session revoked; response body is empty
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: CSRF validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/vehicles:
    get:
      tags: [Dispatcher fleet]
      summary: Read current fleet snapshot
      operationId: listVehicles
      security:
        - dispatcherCookie: []
      responses:
        '200':
          description: Fleet snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/vehicles/{vehicleID}/history:
    get:
      tags: [Dispatcher fleet]
      summary: Read bounded playback history for the newest tracking session
      operationId: getVehicleHistory
      security:
        - dispatcherCookie: []
      parameters:
        - name: vehicleID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 1
      responses:
        '200':
          description: Chronological, bounded route history for the newest session in the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/device/session:
    post:
      tags: [Tracker authentication]
      summary: Exchange provisioned device credential for short-lived bearer token
      operationId: createDeviceSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSessionRequest'
      responses:
        '200':
          description: Device session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tracker/history:
    post:
      tags: [Tracker replay]
      summary: Replay buffered tracker locations
      description: |
        Accepts 1 to 500 location records in a request body limited by the server
        to 512 KiB. New records are persisted idempotently and broadcast to
        dispatcher WebSocket clients with `replayed: true`.
      operationId: replayTrackerHistory
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
      responses:
        '200':
          description: Batch processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    dispatcherCookie:
      type: apiKey
      in: cookie
      name: ambulance_session
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, or expired authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Authentication rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal operation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unhealthy]

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    User:
      type: object
      required: [id, username, role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [dispatcher, admin]

    LoginResponse:
      type: object
      required: [user, csrf_token, expires_at]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time

    DeviceSessionRequest:
      type: object
      required: [vehicle_code, device_key]
      additionalProperties: false
      properties:
        vehicle_code:
          type: string
        device_key:
          type: string
          format: password

    Device:
      type: object
      required: [id, vehicle_id, vehicle_code, name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        vehicle_code:
          type: string
        name:
          type: string

    DeviceSessionResponse:
      type: object
      required: [access_token, expires_at, device]
      additionalProperties: false
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        device:
          $ref: '#/components/schemas/Device'

    Location:
      type: object
      required:
        - tracking_session_id
        - sequence_number
        - recorded_at
        - latitude
        - longitude
      properties:
        device_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        vehicle_code:
          type: string
        tracking_session_id:
          type: string
          format: uuid
        sequence_number:
          type: integer
          format: int64
          minimum: 0
        recorded_at:
          type: string
          format: date-time
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0
        speed_mps:
          type: number
          minimum: 0
        bearing_deg:
          type: number
          minimum: 0
          exclusiveMaximum: 360
        altitude_m:
          type: number
        battery_pct:
          type: integer
          minimum: 0
          maximum: 100
        network_type:
          type: string

    VehicleSnapshot:
      type: object
      required: [vehicle_id, vehicle_code, label, status]
      properties:
        vehicle_id:
          type: string
          format: uuid
        vehicle_code:
          type: string
        label:
          type: string
        status:
          type: string
        location:
          $ref: '#/components/schemas/Location'

    FleetResponse:
      type: object
      required: [vehicles, server_time]
      additionalProperties: false
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehicleSnapshot'
        server_time:
          type: string
          format: date-time

    HistoryResponse:
      type: object
      required: [vehicle_id, from, to, locations]
      additionalProperties: false
      properties:
        vehicle_id:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        locations:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Location'

    ReplayRequest:
      type: object
      required: [locations]
      additionalProperties: false
      properties:
        locations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Location'

    ReplayResponse:
      type: object
      required: [accepted, duplicates]
      additionalProperties: false
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
