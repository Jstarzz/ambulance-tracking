services:
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ambulance
      POSTGRES_USER: ambulance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambulance-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambulance -d ambulance"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose: ["8080"]
    networks: [internal, edge]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
